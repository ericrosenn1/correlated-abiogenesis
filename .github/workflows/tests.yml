name: tests

on:
  push:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Test
        if: matrix.python-version != '3.12'
        run: python -m pytest
      - name: Test with coverage
        if: matrix.python-version == '3.12'
        run: python -m pytest --cov=correlated_abiogenesis --cov-report=xml:coverage.xml
      - name: Reproduce Appendix B smoke test
        run: python -m correlated_abiogenesis.appendix_b --quick --output-dir outputs-ci
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: false
          use_oidc: true
